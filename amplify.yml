version: 1
applications:
  - appRoot: angular-movie-manager
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 18 || nvm install 18
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist/coreui-free-angular-admin-template
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
